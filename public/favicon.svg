<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.8"/>
  <!-- Latitude lines -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="url(#g)" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="16" cy="16" rx="14" ry="10" fill="none" stroke="url(#g)" stroke-width="0.7" opacity="0.3"/>
  <!-- Longitude line -->
  <ellipse cx="16" cy="16" rx="5" ry="14" fill="none" stroke="url(#g)" stroke-width="0.7" opacity="0.4"/>
  <!-- Crosshair -->
  <line x1="16" y1="2" x2="16" y2="6" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="16" y1="26" x2="16" y2="30" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="2" y1="16" x2="6" y2="16" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="26" y1="16" x2="30" y2="16" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#06b6d4" opacity="0.9"/>
</svg>
